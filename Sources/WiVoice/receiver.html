<!doctype html>
<html lang="en">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta charset="utf-8">
<title>WiVoice Receiver</title>
<style>
body{font:17px system-ui;background:#111827;color:#f9fafb;max-width:560px;margin:12vh auto;padding:24px}h1{font-size:2rem}p{color:#cbd5e1;line-height:1.5}button{font:inherit;padding:12px 20px;border:0;border-radius:10px;background:#38bdf8;color:#082f49;font-weight:700}#status{margin-top:20px;color:#94a3b8}
</style>
<h1>WiVoice</h1>
<p>This device must be on the same Wi-Fi network as the streaming Mac.</p>
<button id="listen">Listen</button>
<p id="status">Not connected</p>
<script>
let ws,ctx,nextTime=[0,0];
document.querySelector('#listen').onclick=async()=>{
  try{
    ctx=new (window.AudioContext||window.webkitAudioContext)({sampleRate:48000});await ctx.resume();
    ws=new WebSocket(`ws://${location.hostname}:${location.port||8765}`);ws.binaryType='arraybuffer';
    ws.onopen=()=>{document.querySelector('#status').textContent='Connected. Playing incoming audio.';nextTime=[ctx.currentTime+0.08,ctx.currentTime+0.08];document.querySelector('#listen').textContent='Listening'};
    ws.onmessage=e=>{
      const bytes=new Uint8Array(e.data);if(bytes.byteLength<5)return;
      const kind=bytes[0],sampleRate=new DataView(bytes.buffer,bytes.byteOffset,bytes.byteLength).getUint32(1,false);
      const floats=new Float32Array(bytes.buffer,bytes.byteOffset+5,Math.floor((bytes.byteLength-5)/4));
      const frames=Math.floor(floats.length/2);if(!frames)return;
      const left=new Float32Array(frames),right=new Float32Array(frames);
      for(let i=0;i<frames;i++){left[i]=floats[i*2];right[i]=floats[i*2+1]}
      const audio=ctx.createBuffer(2,frames,sampleRate);audio.copyToChannel(left,0);audio.copyToChannel(right,1);
      const src=ctx.createBufferSource();src.buffer=audio;src.connect(ctx.destination);const lane=kind===1?1:0,start=Math.max(nextTime[lane],ctx.currentTime+0.04);src.start(start);nextTime[lane]=start+audio.duration;
      if(kind===1)document.querySelector('#status').textContent='Connected. Playing system audio and microphone.';
    };
    ws.onerror=()=>document.querySelector('#status').textContent='Could not connect. Check Wi-Fi and the Mac firewall.';
    ws.onclose=()=>document.querySelector('#status').textContent='Disconnected';
  }catch(e){document.querySelector('#status').textContent='Audio could not start: '+e.message}
};
</script>
</html>
